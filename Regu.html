<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育行政與法規 互動題庫系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- 頂部導航 -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center backdrop-blur-sm">
          <i class="fa-solid fa-graduation-cap text-xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-tight">教育行政與法規</h1>
          <p class="text-xs text-indigo-200 hidden sm:block">教師資格檢定與甄試 • 互動試題實戰庫</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="quizModeBadge" class="bg-indigo-800/80 px-2.5 py-1 rounded-full text-indigo-100 text-xs font-medium border border-indigo-500/50">
          即時練習模式
        </span>
        <button id="bookmarkFilterBtn" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-bookmark"></i>
          <span>錯題與收藏 (<span id="bookmarkCount">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主主體佈局 -->
  <div class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">

    <!-- 左側主答題區塊 -->
    <main class="flex-1 min-w-0">
      
      <!-- 控制列 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-5 flex flex-wrap gap-3 justify-between items-center">
        <div class="flex flex-wrap items-center gap-2">
          <label class="text-xs font-semibold text-slate-500">試題類別：</label>
          <select id="categorySelect" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
            <option value="all">全卷完整測驗 (全收錄 70 題)</option>
            <option value="law">教育法規體系與權限劃分</option>
            <option value="teacher">教師聘任、解聘、停聘與權益救濟</option>
            <option value="counsel">學生輔導、性平、兒保與霸凌防制</option>
            <option value="practice">班級經營、教育哲學與教育實習</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <button id="switchModeBtn" class="px-3 py-1.5 rounded-xl border border-indigo-600 text-indigo-600 hover:bg-indigo-50 text-xs sm:text-sm font-semibold transition active:scale-95">
            切換為模擬測驗
          </button>
          <button id="resetQuizBtn" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-medium transition active:scale-95">
            <i class="fa-solid fa-arrows-rotate mr-1"></i>重設
          </button>
        </div>
      </div>

      <!-- 進度與即時統計 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-5">
        <div class="flex justify-between items-center text-xs sm:text-sm font-semibold mb-2 text-slate-600">
          <div>
            當前題目：<span id="currentQuestionNum" class="text-indigo-600 text-base font-bold">1</span> / <span id="totalQuestionsNum">0</span>
          </div>
          <div id="scoreDisplay" class="flex items-center gap-2">
            <span>答對率：<strong id="accuracyRate" class="text-emerald-600 font-bold">0%</strong></span>
            <span class="text-slate-400">|</span>
            <span class="text-slate-500">(<span id="correctNum">0</span> 正確 / <span id="answeredNum">0</span> 已答)</span>
          </div>
          <div id="timerDisplay" class="hidden text-amber-600 font-mono text-sm font-bold bg-amber-50 px-2.5 py-0.5 rounded-lg border border-amber-200">
            <i class="fa-regular fa-clock mr-1"></i>00:00
          </div>
        </div>
        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- 題幹核心卡片 -->
      <div id="quizContainer" class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-5 sm:p-8 relative">
        
        <!-- 標籤與收藏 -->
        <div class="flex justify-between items-center mb-4">
          <span id="questionTag" class="text-xs px-3 py-1 bg-indigo-50 text-indigo-700 font-semibold rounded-full border border-indigo-100">
            法規重點
          </span>
          <button id="starBtn" class="text-slate-300 hover:text-amber-500 transition text-xl p-1 rounded-lg" title="標記收藏或錯題">
            <i class="fa-regular fa-star"></i>
          </button>
        </div>

        <!-- 題幹文字 -->
        <div id="questionText" class="text-base sm:text-lg font-medium text-slate-800 leading-relaxed mb-6">
          題目載入中...
        </div>

        <!-- 選項列表 -->
        <div id="optionsList" class="space-y-3 mb-6">
          <!-- 選項按鈕由 JS 生成 -->
        </div>

        <!-- 試題解析面板 -->
        <div id="explanationPanel" class="hidden bg-slate-50 border border-slate-200/90 rounded-2xl p-5 mt-6 transition-all duration-300">
          <div class="flex items-center gap-2 mb-2 font-bold text-sm sm:text-base" id="resultStatus">
            <!-- 結果標籤 -->
          </div>
          <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 flex items-center gap-1">
            <i class="fa-solid fa-book-open-reader"></i> 法規條文解析與核心觀念
          </div>
          <div id="explanationText" class="text-xs sm:text-sm text-slate-600 leading-relaxed whitespace-pre-line bg-white p-4 rounded-xl border border-slate-100">
            解析內容...
          </div>
        </div>

        <!-- 底部切換按鈕 -->
        <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
          <button id="prevBtn" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs sm:text-sm font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-chevron-left mr-1"></i> 上一題
          </button>
          
          <div class="flex items-center gap-2">
            <button id="nextBtn" class="px-5 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 text-xs sm:text-sm font-semibold transition shadow-sm active:scale-95">
              下一題 <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
            <button id="submitExamBtn" class="hidden px-5 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 text-xs sm:text-sm font-semibold transition shadow-sm active:scale-95">
              <i class="fa-solid fa-paper-plane mr-1"></i> 提交考卷
            </button>
          </div>
        </div>

      </div>

    </main>

    <!-- 右側題號導航卡 (電腦版常駐，手機版摺疊於下方) -->
    <aside class="w-full lg:w-72 shrink-0">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 sticky top-20">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-table-cells text-indigo-600"></i> 題號速查跳轉
          </h2>
          <span class="text-xs text-slate-400">點擊跳至該題</span>
        </div>
        
        <!-- 狀態圖例 -->
        <div class="flex items-center gap-3 text-[11px] text-slate-500 mb-3 pb-3 border-b border-slate-100">
          <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>答對</div>
          <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>答錯</div>
          <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>已選</div>
          <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-200"></span>未答</div>
        </div>

        <!-- 網格題號按鈕容器 -->
        <div id="questionGrid" class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-2 max-h-72 overflow-y-auto p-1">
          <!-- 由 JS 渲染 -->
        </div>

        <!-- 快捷功能 -->
        <div class="mt-4 pt-4 border-t border-slate-100 flex flex-col gap-2">
          <button id="quickClearBookmarks" class="text-xs text-slate-500 hover:text-rose-600 text-left py-1 flex items-center gap-1 transition">
            <i class="fa-regular fa-trash-can"></i> 清除所有收藏與錯題記號
          </button>
        </div>
      </div>
    </aside>

  </div>

  <!-- 自訂確認與訊息對話框 (取代 alert/confirm) -->
  <div id="customModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 text-center shadow-xl border border-slate-100">
      <div id="modalIcon" class="w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center text-xl bg-indigo-50 text-indigo-600">
        <i class="fa-solid fa-circle-question"></i>
      </div>
      <h3 id="modalTitle" class="text-base font-bold text-slate-800 mb-1">提示訊息</h3>
      <p id="modalMsg" class="text-xs sm:text-sm text-slate-500 mb-5 leading-relaxed">訊息內容</p>
      <div class="flex gap-2">
        <button id="modalCancelBtn" class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs sm:text-sm transition">
          取消
        </button>
        <button id="modalConfirmBtn" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm transition shadow-sm">
          確定
        </button>
      </div>
    </div>
  </div>

  <!-- 測驗結算成績面板 (Modal) -->
  <div id="summaryModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl border border-slate-100">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
        <i class="fa-solid fa-award"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-1">模擬測驗成績揭曉</h2>
      <p class="text-xs text-slate-500 mb-5">測驗表現統計如下，建議針對錯題進行加強複習：</p>
      
      <div class="grid grid-cols-3 gap-3 mb-5 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
        <div>
          <div class="text-[11px] text-slate-400 font-medium">總測驗題數</div>
          <div id="sumTotal" class="text-lg font-bold text-slate-700 mt-0.5">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-medium">答對題數</div>
          <div id="sumCorrect" class="text-lg font-bold text-emerald-600 mt-0.5">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-medium">總得分率</div>
          <div id="sumScore" class="text-lg font-bold text-indigo-600 mt-0.5">0%</div>
        </div>
      </div>

      <div class="flex gap-3">
        <button id="reviewExamBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs sm:text-sm transition">
          <i class="fa-solid fa-list-check mr-1"></i> 查看試題解析
        </button>
        <button id="restartBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition shadow-sm">
          <i class="fa-solid fa-arrow-rotate-right mr-1"></i> 再試一次
        </button>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 bg-white border-t border-slate-200/80 mt-auto">
    教育行政與法規 • 互動式複習評量系統 (收錄國民教育法/教育基本法/教師法/性平法最新題型)
  </footer>

  <!-- 試題資料與核心邏輯 -->
  <script>
    // 試題資料庫 (逐頁完整收錄 PDF 文件 1~72 頁全部 70 道試題與精闢解析)
    const questions = [
      {
        id: 1,
        category: "law",
        tag: "國民教育法",
        question: "依據我國《國民教育法》之規定，關於國民小學及國民中學校長之任期及連任限制，下列敘述何者正確？",
        options: [
          { key: "A", text: "任期三年，在同一學校得連任兩次。" },
          { key: "B", text: "任期三年，在同一學校得連任一次。" },
          { key: "C", text: "任期四年，在同一學校得連任兩次。" },
          { key: "D", text: "任期四年，在同一學校得連任一次。" }
        ],
        answer: "D",
        rationale: "依據我國《國民教育法》第17條規定，公立國民小學及國民中學校長任期一任為四年。校長辦學績效考評優良者，經遴選會就其考評結果審議通過後，在同一學校得連任一次（即在同一學校最長得擔任八年校長）。故選項(D)為正確描述。"
      },
      {
        id: 2,
        category: "practice",
        tag: "教育行政體制",
        question: "章老師是一位教學工作者，他常埋怨政府制定教育綱要時未能考慮當地的特殊教學狀況，而且學生常因學制分流造成跑道轉換的困難。請問章老師所在的教育行政體制為下列何者？",
        options: [
          { key: "A", text: "中央集權制；單軌制" },
          { key: "B", text: "中央集權制；雙(多)軌制" },
          { key: "C", text: "地方分權制；單軌制" },
          { key: "D", text: "地方分權制；雙(多)軌制" }
        ],
        answer: "B",
        rationale: "根據題幹「未能考慮當地的特殊教學狀況」，判斷應屬標準統一制定、無法因地制宜之中央集權制；又題幹提及學制的分流造成跑道轉換困難，指學生在國民教育結束後即進行普通學術及職業技術學校分流之雙(多)軌制。綜合以上答案為 (B)。"
      },
      {
        id: 3,
        category: "law",
        tag: "行政權限分工",
        question: "教育行政涉及中央、地方及學校等不同層級。下列有關教育行政權限分工的敘述，何者正確？",
        options: [
          { key: "A", text: "教育事務皆由中央主管機關決定。" },
          { key: "B", text: "地方政府僅負責執行中央政策。" },
          { key: "C", text: "各教育行政機關應依其法定職權辦理教育事務。" },
          { key: "D", text: "學校不具有任何教育行政上的自主權。" }
        ],
        answer: "C",
        rationale: "教育行政涉及不同層級機關的權責分工，中央、地方及學校各有其法定職權，並非所有教育事務皆由中央決定。因此(C)正確。(A)(B)將教育行政過度視為中央集權；(D)錯誤否定學校依法規享有的行政與校務自主空間。"
      },
      {
        id: 4,
        category: "counsel",
        tag: "性別平等教育法",
        question: "某國中陳導師在批改聯絡簿時，發現班上女學生小美留言反映，近期常遭同班男同學阿強以帶有性暗示的言語嘲笑與騷擾，讓她感到非常不舒服且害怕上學。依據《性別平等教育法》及相關校園安全法規，陳導師接下來的處理方式，下列何者最為適法？",
        options: [
          { key: "A", text: "為保護學生隱私，陳導師應先私下將雙方當事人找來辦公室進行調解，若調解不成再向上通報。" },
          { key: "B", text: "陳導師應立刻親自展開調查，詢問周遭同學以釐清事件真相後，將調查報告送交學務處。" },
          { key: "C", text: "陳導師應於知悉事件後24小時內，向學校權責人員進行校安通報，並由學校依法向當地社政主管機關通報。" },
          { key: "D", text: "此為學生間的同儕衝突，陳導師應直接聯絡雙方家長，交由家長會協調道歉與賠償事宜即可。" }
        ],
        answer: "C",
        rationale: "法規核心：依《性別平等教育法》規定，教師知悉疑似校園性別事件具備「24小時內通報」之絕對法定義務，且案件調查權專屬於學校「性平會」。《校園性別事件防治準則》明文禁止學校人員私下調解，導師亦無自行調查權。"
      },
      {
        id: 5,
        category: "counsel",
        tag: "正向管教規範",
        question: "某高中學生在上課期間使用手機，已影響正常教學活動。教師依學校相關規定，要求學生將手機交由學校暫時保管，若學生拒絕配合，教師則將其交由學務處依相關規定處理。關於上述教師的處理方式，下列何者最適當？",
        options: [
          { key: "A", text: "教師為維持教學秩序，得自行決定管教方式，不必受學校相關規定限制。" },
          { key: "B", text: "學生拒絕教師的管教要求，即屬重大違規，教師得直接予以大過處分。" },
          { key: "C", text: "教師得依學校相關規定採取適當的管教措施；學生拒絕配合時，必要時得請學校相關單位協助處理。" },
          { key: "D", text: "為保障學生權益，教師不得暫時保管學生物品，也不得將學生交由學務處處理。" }
        ],
        answer: "C",
        rationale: "教師及學校在符合相關規定的情況下，得對影響學習或教學活動之物品進行暫時保管；學生拒絕配合時，得依程序交由學務處等相關單位協助處理，管教措施必須依法行政並符合比例原則。"
      },
      {
        id: 6,
        category: "practice",
        tag: "公費生培育規定",
        question: "小明為師資培育公費生，畢業後依規定分發至偏遠地區學校服務。在服務期間，小明因個人生涯規劃，希望提前申請離開原分發學校，並至一般地區學校任教。下列何者符合師資培育公費生相關規定？",
        options: [

    // 系統狀態
    let activeQuestions = [...questions];
    let currentIndex = 0;
    let userAnswers = {}; // { qId: 'A' }
    let bookmarkedIds = new Set();
    let isExamMode = false;
    let isBookmarkOnly = false;
    let timerInterval = null;
    let timerSeconds = 0;

    // DOM 元素快取
    const categorySelect = document.getElementById('categorySelect');
    const switchModeBtn = document.getElementById('switchModeBtn');
    const quizModeBadge = document.getElementById('quizModeBadge');
    const resetQuizBtn = document.getElementById('resetQuizBtn');
    const bookmarkFilterBtn = document.getElementById('bookmarkFilterBtn');
    const bookmarkCount = document.getElementById('bookmarkCount');

    const currentQuestionNum = document.getElementById('currentQuestionNum');
    const totalQuestionsNum = document.getElementById('totalQuestionsNum');
    const accuracyRate = document.getElementById('accuracyRate');
    const correctNumSpan = document.getElementById('correctNum');
    const answeredNumSpan = document.getElementById('answeredNum');
    const progressBar = document.getElementById('progressBar');
    const timerDisplay = document.getElementById('timerDisplay');

    const questionTag = document.getElementById('questionTag');
    const starBtn = document.getElementById('starBtn');
    const questionText = document.getElementById('questionText');
    const optionsList = document.getElementById('optionsList');
    const explanationPanel = document.getElementById('explanationPanel');
    const resultStatus = document.getElementById('resultStatus');
    const explanationText = document.getElementById('explanationText');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitExamBtn = document.getElementById('submitExamBtn');
    const questionGrid = document.getElementById('questionGrid');
    const quickClearBookmarks = document.getElementById('quickClearBookmarks');

    // Modal 元件
    const customModal = document.getElementById('customModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMsg = document.getElementById('modalMsg');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');

    const summaryModal = document.getElementById('summaryModal');
    const sumTotal = document.getElementById('sumTotal');
    const sumCorrect = document.getElementById('sumCorrect');
    const sumScore = document.getElementById('sumScore');
    const reviewExamBtn = document.getElementById('reviewExamBtn');
    const restartBtn = document.getElementById('restartBtn');

    // 彈出對話框回調管理
    let modalConfirmCallback = null;

    function showDialog(title, message, onConfirm, showCancel = true) {
      modalTitle.innerText = title;
      modalMsg.innerText = message;
      modalConfirmCallback = onConfirm;
      
      if (showCancel) {
        modalCancelBtn.classList.remove('hidden');
      } else {
        modalCancelBtn.classList.add('hidden');
      }
      customModal.classList.remove('hidden');
    }

    modalCancelBtn.addEventListener('click', () => {
      customModal.classList.add('hidden');
      modalConfirmCallback = null;
    });

    modalConfirmBtn.addEventListener('click', () => {
      customModal.classList.add('hidden');
      if (typeof modalConfirmCallback === 'function') {
        modalConfirmCallback();
      }
      modalConfirmCallback = null;
    });

    // 初始化載入
    function init() {
      applyFilters();
      buildQuestionGrid();
      bindEvents();
    }

    // 事件監聽綁定
    function bindEvents() {
      categorySelect.addEventListener('change', () => {
        isBookmarkOnly = false;
        bookmarkFilterBtn.classList.remove('ring-2', 'ring-amber-300', 'bg-amber-600');
        applyFilters();
      });

      switchModeBtn.addEventListener('click', toggleQuizMode);
      resetQuizBtn.addEventListener('click', confirmReset);
      bookmarkFilterBtn.addEventListener('click', toggleBookmarkView);
      starBtn.addEventListener('click', toggleBookmarkCurrent);
      quickClearBookmarks.addEventListener('click', clearAllBookmarks);

      prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderCurrentQuestion();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (currentIndex < activeQuestions.length - 1) {
          currentIndex++;
          renderCurrentQuestion();
        }
      });

      submitExamBtn.addEventListener('click', submitExam);

      reviewExamBtn.addEventListener('click', () => {
        summaryModal.classList.add('hidden');
        isExamMode = false;
        quizModeBadge.innerText = '成績複習模式';
        switchModeBtn.innerText = '切換為模擬測驗';
        stopTimer();
        timerDisplay.classList.add('hidden');
        renderCurrentQuestion();
      });

      restartBtn.addEventListener('click', () => {
        summaryModal.classList.add('hidden');
        userAnswers = {};
        currentIndex = 0;
        if (isExamMode) startTimer();
        renderCurrentQuestion();
        updateStats();
      });
    }

    // 篩選試題清單
    function applyFilters() {
      const cat = categorySelect.value;
      if (isBookmarkOnly) {
        activeQuestions = questions.filter(q => bookmarkedIds.has(q.id));
      } else if (cat === 'all') {
        activeQuestions = [...questions];
      } else {
        activeQuestions = questions.filter(q => q.category === cat);
      }

      currentIndex = 0;
      totalQuestionsNum.innerText = activeQuestions.length;

      if (activeQuestions.length === 0) {
        questionText.innerText = "此分類下暫無題目。";
        optionsList.innerHTML = "";
        explanationPanel.classList.add('hidden');
        currentQuestionNum.innerText = "0";
        questionTag.innerText = "無題目";
        progressBar.style.width = "0%";
      } else {
        renderCurrentQuestion();
      }
      buildQuestionGrid();
      updateStats();
    }

    // 渲染當前試題
    function renderCurrentQuestion() {
      if (activeQuestions.length === 0) return;

      const q = activeQuestions[currentIndex];
      currentQuestionNum.innerText = currentIndex + 1;
      totalQuestionsNum.innerText = activeQuestions.length;

      // 進度條
      const progressPercent = ((currentIndex + 1) / activeQuestions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // 標籤與星號
      questionTag.innerText = q.tag;
      if (bookmarkedIds.has(q.id)) {
        starBtn.innerHTML = '<i class="fa-solid fa-star text-amber-500"></i>';
      } else {
        starBtn.innerHTML = '<i class="fa-regular fa-star text-slate-300"></i>';
      }

      // 題目
      questionText.innerText = `${q.id}. ${q.question}`;

      // 選項清單
      optionsList.innerHTML = '';
      const selected = userAnswers[q.id];

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 sm:p-4 rounded-2xl border transition-all text-xs sm:text-sm flex items-start gap-3 relative";

        let borderClass = "border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 shadow-sm";
        let badgeClass = "bg-slate-100 text-slate-600 border border-slate-300";

        if (!isExamMode) {
          // 練習模式或複習模式：若已作答，顯示顏色回饋
          if (selected) {
            if (opt.key === q.answer) {
              borderClass = "border-emerald-500 bg-emerald-50/70 text-emerald-900 font-semibold ring-1 ring-emerald-400";
              badgeClass = "bg-emerald-600 text-white border-emerald-600";
            } else if (opt.key === selected) {
              borderClass = "border-rose-400 bg-rose-50/70 text-rose-900 ring-1 ring-rose-400";
              badgeClass = "bg-rose-500 text-white border-rose-500";
            }
          }
        } else {
          // 考試模式：僅標示目前選取項目
          if (selected === opt.key) {
            borderClass = "border-indigo-600 bg-indigo-50/70 text-indigo-900 font-semibold ring-1 ring-indigo-500";
            badgeClass = "bg-indigo-600 text-white border-indigo-600";
          }
        }

        btn.className = `w-full text-left p-3.5 sm:p-4 rounded-2xl border transition-all text-xs sm:text-sm flex items-start gap-3 ${borderClass}`;
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 mt-0.5 ${badgeClass}">
            ${opt.key}
          </span>
          <span class="flex-1 leading-relaxed">${opt.text}</span>
        `;

        btn.addEventListener('click', () => chooseOption(q.id, opt.key));
        optionsList.appendChild(btn);
      });

      // 解析卡片顯示控制
      if (!isExamMode && selected) {
        explanationPanel.classList.remove('hidden');
        if (selected === q.answer) {
          resultStatus.innerHTML = `<span class="text-emerald-600 flex items-center gap-1.5"><i class="fa-solid fa-circle-check text-lg"></i> 作答正確！</span>`;
        } else {
          resultStatus.innerHTML = `<span class="text-rose-600 flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark text-lg"></i> 答錯了！正確解答為 (${q.answer})</span>`;
        }
        explanationText.innerText = q.rationale;
      } else {
        explanationPanel.classList.add('hidden');
      }

      // 按鈕狀態控制
      prevBtn.disabled = currentIndex === 0;
      if (currentIndex === activeQuestions.length - 1) {
        nextBtn.classList.add('hidden');
        if (isExamMode) {
          submitExamBtn.classList.remove('hidden');
        }
      } else {
        nextBtn.classList.remove('hidden');
        submitExamBtn.classList.add('hidden');
      }

      highlightGridCurrent();
    }

    // 作答選擇邏輯
    function chooseOption(qId, key) {
      const q = questions.find(item => item.id === qId);

      // 練習模式若已作答則不重複鎖定
      if (!isExamMode && userAnswers[qId]) return;

      userAnswers[qId] = key;

      // 練習模式答錯自動收藏錯題
      if (!isExamMode && key !== q.answer) {
        bookmarkedIds.add(qId);
        updateBookmarkCountUI();
      }

      updateStats();
      renderCurrentQuestion();
      buildQuestionGrid();
    }

    // 建立題號導航網格
    function buildQuestionGrid() {
      questionGrid.innerHTML = '';
      activeQuestions.forEach((q, idx) => {
        const itemBtn = document.createElement('button');
        const ans = userAnswers[q.id];
        
        let colorClass = "bg-slate-100 text-slate-600 hover:bg-slate-200";

        if (!isExamMode) {
          if (ans) {
            colorClass = ans === q.answer ? "bg-emerald-500 text-white font-bold" : "bg-rose-500 text-white font-bold";
          }
        } else {
          if (ans) {
            colorClass = "bg-indigo-600 text-white font-bold";
          }
        }

        if (idx === currentIndex) {
          colorClass += " ring-2 ring-offset-1 ring-slate-800 scale-105 z-10";
        }

        itemBtn.className = `w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all ${colorClass}`;
        itemBtn.innerText = idx + 1;
        itemBtn.title = `第 ${idx + 1} 題：${q.tag}`;

        itemBtn.addEventListener('click', () => {
          currentIndex = idx;
          renderCurrentQuestion();
        });

        questionGrid.appendChild(itemBtn);
      });
    }

    function highlightGridCurrent() {
      const buttons = questionGrid.querySelectorAll('button');
      buttons.forEach((btn, idx) => {
        if (idx === currentIndex) {
          btn.classList.add('ring-2', 'ring-offset-1', 'ring-slate-800', 'scale-105');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-1', 'ring-slate-800', 'scale-105');
        }
      });
    }

    // 計分統計
    function updateStats() {
      let correct = 0;
      let totalAnswered = 0;

      activeQuestions.forEach(q => {
        const ans = userAnswers[q.id];
        if (ans) {
          totalAnswered++;
          if (ans === q.answer) correct++;
        }
      });

      correctNumSpan.innerText = correct;
      answeredNumSpan.innerText = totalAnswered;
      const rate = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
      accuracyRate.innerText = `${rate}%`;
    }

    // 收藏 / 錯題開關
    function toggleBookmarkCurrent() {
      const q = activeQuestions[currentIndex];
      if (bookmarkedIds.has(q.id)) {
        bookmarkedIds.delete(q.id);
      } else {
        bookmarkedIds.add(q.id);
      }
      updateBookmarkCountUI();
      renderCurrentQuestion();
    }

    function updateBookmarkCountUI() {
      bookmarkCount.innerText = bookmarkedIds.size;
    }

    function toggleBookmarkView() {
      isBookmarkOnly = !isBookmarkOnly;
      if (isBookmarkOnly) {
        if (bookmarkedIds.size === 0) {
          showDialog("收藏庫為空", "目前尚未收藏任何題目或產生錯題！在作答中點擊星星可隨時加入收藏。", null, false);
          isBookmarkOnly = false;
          return;
        }
        bookmarkFilterBtn.classList.add('ring-2', 'ring-amber-300', 'bg-amber-600');
        applyFilters();
      } else {
        bookmarkFilterBtn.classList.remove('ring-2', 'ring-amber-300', 'bg-amber-600');
        applyFilters();
      }
    }

    function clearAllBookmarks() {
      if (bookmarkedIds.size === 0) {
        showDialog("提示", "目前沒有任何收藏題目。", null, false);
        return;
      }
      showDialog("確認清除", "是否確定清空目前所有的錯題與星號收藏紀錄？", () => {
        bookmarkedIds.clear();
        updateBookmarkCountUI();
        if (isBookmarkOnly) {
          isBookmarkOnly = false;
          bookmarkFilterBtn.classList.remove('ring-2', 'ring-amber-300', 'bg-amber-600');
          applyFilters();
        } else {
          renderCurrentQuestion();
        }
      });
    }

    // 模式切換 (練習 <-> 測驗)
    function toggleQuizMode() {
      if (!isExamMode) {
        showDialog("切換至模擬測驗模式", "測驗模式中將「隱藏即時答案與詳解」，並啟動測驗計時器。確定開始模擬考試嗎？", () => {
          isExamMode = true;
          quizModeBadge.innerText = '模擬測驗中';
          quizModeBadge.className = 'bg-amber-500 px-2.5 py-1 rounded-full text-white text-xs font-semibold shadow-sm';
          switchModeBtn.innerText = '切換為即時練習';
          timerDisplay.classList.remove('hidden');
          startTimer();
          userAnswers = {}; // 重置答案以進行純測驗
          renderCurrentQuestion();
          buildQuestionGrid();
          updateStats();
        });
      } else {
        isExamMode = false;
        quizModeBadge.innerText = '即時練習模式';
        quizModeBadge.className = 'bg-indigo-800/80 px-2.5 py-1 rounded-full text-indigo-100 text-xs font-medium border border-indigo-500/50';
        switchModeBtn.innerText = '切換為模擬測驗';
        timerDisplay.classList.add('hidden');
        stopTimer();
        renderCurrentQuestion();
        buildQuestionGrid();
      }
    }

    // 計時器
    function startTimer() {
      timerSeconds = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        timerDisplay.innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // 提交考卷
    function submitExam() {
      const unansweredCount = activeQuestions.filter(q => !userAnswers[q.id]).length;
      let confirmMsg = "確定提交考卷並結算成績嗎？";
      if (unansweredCount > 0) {
        confirmMsg = `尚有 ${unansweredCount} 題未作答，確定要現在交卷結算嗎？`;
      }

      showDialog("交卷確認", confirmMsg, () => {
        stopTimer();
        let correctCount = 0;
        activeQuestions.forEach(q => {
          if (userAnswers[q.id] === q.answer) {
            correctCount++;
          } else {
            bookmarkedIds.add(q.id); // 錯題自動加入收藏
          }
        });

        updateBookmarkCountUI();
        const score = Math.round((correctCount / activeQuestions.length) * 100);

        sumTotal.innerText = activeQuestions.length;
        sumCorrect.innerText = correctCount;
        sumScore.innerText = `${score}分`;

        summaryModal.classList.remove('hidden');
      });
    }

    // 重設進度
    function confirmReset() {
      showDialog("重新作答", "是否確認清空目前答題紀錄？", () => {
        userAnswers = {};
        currentIndex = 0;
        if (isExamMode) startTimer();
        renderCurrentQuestion();
        buildQuestionGrid();
        updateStats();
      });
    }

    // 頁面載入完成啟動
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
